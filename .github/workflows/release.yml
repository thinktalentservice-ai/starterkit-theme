name: Release

# Runs when a GitHub Release is published.
#   guard  -> release tag must match package.json "version"
#   build  -> same build as CI (reuses ci.yml); everything below needs it to pass
#   pages  -> redeploys Storybook to GitHub Pages, ONLY if Pages is already enabled
#   npm    -> publishes to npm using NPM_TOKEN from the "npm" environment

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  guard:
    name: Check tag matches package.json
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          tag_version="${TAG#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$pkg_version'. Bump the version (or fix the tag) and publish the release again."
            exit 1
          fi
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      upload-artifact: true
      artifact-name: build-output
      artifact-path: dist

  # ---------------------------------------------------------------- GitHub Pages
  pages-check:
    name: Detect GitHub Pages + Storybook
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
      mode: ${{ steps.check.outputs.mode }}
      branch: ${{ steps.check.outputs.branch }}
      dir: ${{ steps.check.outputs.dir }}
      script: ${{ steps.check.outputs.script }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          skip() { echo "::notice title=GitHub Pages skipped::$1"; out deploy false; exit 0; }

          # 1. Is Pages already set up for this repo?
          if ! resp=$(gh api "repos/$GITHUB_REPOSITORY/pages" 2>err.txt); then
            if grep -q "Not Found" err.txt; then
              skip "GitHub Pages is not enabled for this repository."
            fi
            cat err.txt; echo "::error::Could not read GitHub Pages settings."; exit 1
          fi
          build_type=$(jq -r '.build_type // "legacy"' <<<"$resp")
          branch=$(jq -r '.source.branch // ""' <<<"$resp")
          path=$(jq -r '.source.path // "/"' <<<"$resp")

          # 2. Does the project have a Storybook build script?
          script=$(node -e "
            const s=(JSON.parse(require('fs').readFileSync('package.json','utf8')).scripts)||{};
            process.stdout.write(['build-storybook','storybook:build','build:storybook'].find(k=>s[k])||'')")
          [ -n "$script" ] || skip "Pages is enabled but package.json has no build-storybook / storybook:build / build:storybook script."

          if [ "$build_type" = "workflow" ]; then
            out mode workflow
          else
            # Branch-based Pages. Never force-push over the default branch.
            [ "$branch" != "$DEFAULT_BRANCH" ] || skip "Pages publishes from '$branch' (the default branch). Switch Pages source to 'GitHub Actions' or a 'gh-pages' branch to enable auto-deploy."
            out mode branch
            out branch "$branch"
            out dir "${path#/}"
          fi
          out script "$script"
          out deploy true
          echo "Deploying Storybook via '$script' (mode: $build_type)"

  pages-build:
    name: Build Storybook
    needs: pages-check
    if: needs.pages-check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      STORYBOOK_DIR: ${{ vars.STORYBOOK_OUTPUT_DIR || 'storybook-static' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup project
        id: setup
        uses: ./.github/actions/setup-project

      # Stories that import the built package get the exact artefact that passed the build.
      - uses: actions/download-artifact@v8
        with:
          name: build-output
          path: dist

      - name: Build Storybook
        shell: bash
        env:
          PM: ${{ steps.setup.outputs.pm }}
          SCRIPT: ${{ needs.pages-check.outputs.script }}
        run: |
          "$PM" run "$SCRIPT"
          if [ ! -d "$STORYBOOK_DIR" ]; then
            echo "::error::Storybook output '$STORYBOOK_DIR' not found. Set repo variable STORYBOOK_OUTPUT_DIR to your output dir."
            exit 1
          fi

      # Pages source = "GitHub Actions": upload in the Pages artifact format.
      - if: needs.pages-check.outputs.mode == 'workflow'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.STORYBOOK_DIR }}

      # Pages source = "Deploy from a branch": plain artifact, pushed by pages-deploy-branch.
      - if: needs.pages-check.outputs.mode == 'branch'
        uses: actions/upload-artifact@v7
        with:
          name: storybook
          path: ${{ env.STORYBOOK_DIR }}
          if-no-files-found: error
          retention-days: 7

  # Pages source = "GitHub Actions"
  pages-deploy:
    name: Deploy Storybook (GitHub Pages)
    needs: [pages-check, pages-build]
    if: needs.pages-check.outputs.mode == 'workflow'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5

  # Pages source = "Deploy from a branch" (e.g. gh-pages)
  pages-deploy-branch:
    name: Deploy Storybook (Pages branch)
    needs: [pages-check, pages-build]
    if: needs.pages-check.outputs.mode == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: storybook
          path: storybook-out
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: ${{ needs.pages-check.outputs.branch }}
          publish_dir: storybook-out
          destination_dir: ${{ needs.pages-check.outputs.dir }}
          commit_message: "docs: deploy Storybook for ${{ github.event.release.tag_name }}"

  # ------------------------------------------------------------------------- npm
  npm-publish:
    name: Publish to npm
    needs: [guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/${{ steps.meta.outputs.name }}/v/${{ needs.guard.outputs.version }}
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v8
        with:
          name: build-output
          path: dist

      - name: Check version is not already on npm
        id: meta
        shell: bash
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          name=$(node -p "require('./package.json').name")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$name@$VERSION is already published on npm."
            exit 1
          fi

      - name: Publish
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is missing from the 'npm' environment."
            exit 1
          fi
          tag=latest
          [ "$PRERELEASE" = "true" ] && tag=next
          npm publish --access public --provenance --tag "$tag"
